[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "blazing_agents"
version = "0.27.0"
description = "Official Python SDK for Blazing Agents"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.urls]
Documentation = "https://docs.blazingagents.com"
Repository = "https://github.com/blazingagents/python-sdk"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pyright>=1.1.403,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blazing_agents"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.mypy]
python_version = "3.11"
strict = true
enable_incomplete_feature = ["TypeForm"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
enableExperimentalFeatures = true
reportPrivateUsage = false
reportUnnecessaryIsInstance = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "SLF001", "TID251", "UP"]
ignore = ["B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]
"!tests/**" = ["SLF001", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"blazing_agents._agent_tools".msg = "Tests must use the public API. Either rewrite this test against the public client, or, if the test really needs this value, the SDK is missing a public way to get it: add one to the public API (with docs) and use that."
