# Pushing a tag vX.Y.Z is the whole release. PyPI's trusted publisher is bound
# to this file name and the pypi environment; keep both names.
name: Publish

on:
  push:
    tags: ["v*"]
  # A dry run: every check and the build for the given tag against the
  # dispatched commit, without publishing to PyPI or creating the GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check, such as v0.24.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      notes: ${{ steps.check.outputs.notes }}
      published: ${{ steps.registry.outputs.published }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Check the tag against pyproject.toml and CHANGELOG.md
        id: check
        run: |
          .github/scripts/release-check.sh "$TAG" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          delim=EOF-$(openssl rand -hex 16)
          {
            echo "notes<<$delim"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      # The trusted publisher took over from versions published by hand, and a
      # rerun must not fail on a version PyPI already has.
      - name: Check whether the version is already on PyPI
        id: registry
        if: steps.check.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/blazing-agents/$VERSION/json")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::blazing_agents $VERSION is already on PyPI; skipping the upload" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::PyPI answered $status"; exit 1 ;;
          esac
      - name: Summarize the release
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
          PUBLISHED: ${{ steps.registry.outputs.published }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            pypi="skipped: prereleases are not published to PyPI"
          elif [ "$PUBLISHED" = true ]; then
            pypi="skipped: $VERSION is already on PyPI"
          else
            pypi="publish blazing_agents $VERSION"
          fi
          {
            [ "$GITHUB_EVENT_NAME" = push ] || echo "**Dry run: nothing below is published.**"
            echo
            echo "- PyPI: $pypi"
            echo "- GitHub release: $TAG (prerelease: $PRERELEASE)"
            echo
            echo "### Release notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Built without the publish job's OIDC token, and on a dry run too, so the
  # dry run proves the distributions build.
  build:
    name: Build the distributions
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: >-
      github.event_name == 'push'
      && needs.verify.outputs.prerelease == 'false'
      && needs.verify.outputs.published == 'false'
    needs: [ci, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # skip-existing: rerunning this job after it uploaded some files but not
      # all reuses verify's earlier answer that the version was not on PyPI.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  release:
    name: Create the GitHub release
    # publish is skipped for a prerelease or a version already on PyPI; the
    # release still goes out then, but never after a failed check.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.ci.result == 'success'
      && needs.verify.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [ci, verify, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A rerun must not fail on a release an earlier attempt already created.
      - name: Create the release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.verify.outputs.notes }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json url -q .url; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" --prerelease="$PRERELEASE"
