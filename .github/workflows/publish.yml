name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/run_typechecks.py
      - run: uv run python scripts/run_tests.py

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} python scripts/run_compatibility.py

  publish:
    if: ${{ !github.event.release.prerelease }}
    needs: [check, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify release tag matches package version
        run: >-
          python -c 'import os, tomllib;
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"];
          assert f"v{version}" == os.environ["GITHUB_REF_NAME"]'
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
